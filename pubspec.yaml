name: chinese_codec
description: "Pure Dart codecs for Chinese charsets: GB18030 (incl. 4-byte and supplementary planes), GBK, GB2312, Big5 (CP950) and Big5-HKSCS. No native dependencies."
version: 0.1.1
repository: https://atomgit.com/eltoro/chinese_codec
issue_tracker: https://atomgit.com/eltoro/chinese_codec/issues

topics:
  - encoding
  - charset
  - chinese
  - gbk
  - gb18030
  - big5

environment:
  sdk: '>=3.0.0 <4.0.0'

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
